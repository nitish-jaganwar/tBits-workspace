<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tBitsAI</title>
 <link rel="icon" href="../images/fevicon.ico">
 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

<aside>
  <div class="logo">
    <div class="logo-box">
       <img src="images/logo.png" alt="Logo" class="logo-img">
    </div>

   <!--  <div class="logo-text">
        <span class="brand">tBits</span>
        <span class="ai-text">AI</span>
    </div> -->
</div>

  <button class="new-chat-btn" onclick="newChat()">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
    New chat
  </button>

  <div class="sidebar-bottom">
    <div class="theme-toggle-row">
      <span class="theme-label">
        <svg id="theme-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span id="theme-label-text">Light mode</span>
      </span>
      <label class="toggle-switch" title="Toggle dark mode">
        <input type="checkbox" id="theme-checkbox" onchange="toggleTheme(this)">
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>
</aside>

<main>
  <div id="chat-container">
    
    <div id="empty-state">
      <div class="ai-greeting-icon">✨</div>
      <div class="welcome-title">Hello. How can I help you today?</div>
 
    </div>

    <div class="chat-inner" id="chat-inner"></div>
    
    <div id="typing-wrap">
      <div class="typing-inner">
        <div class="avatar ai-avatar">t</div>
        <div class="typing-dots">
          <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
        </div>
        <span id="live-timer"></span>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-wrap">
      <textarea id="user-input" rows="1" placeholder="Ask tBits AI anything..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      
      <div class="input-actions">
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="hint">tBits AI · Enterprise RAG POC · May produce inaccurate results</div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
